name = "ch6-pilot-0.10.0"
dataset = "build/env-pilot-0.10.0"
bands = ["vis", "mwir", "lwir"]
vis_input = "raw_adc"
ir_input = "temperature"
items = ["matrix", "sensitivity", "registration_study", "complementarity"]
registration = ["oracle", "epipolar_sweep", "infinity_homography", "resize"]
operators = ["laplacian_pyramid_masked", "noise_aware_pyramid"]
levels = 4
kappa = 2.5
fpn = true
similarity = "grad_ncc"
