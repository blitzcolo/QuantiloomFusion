[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "quantiloom-fusion"
version = "0.1.0"
description = "VIS/MWIR/LWIR heterogeneous-sensor fusion experiment workspace"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "OpenEXR>=3.2",
]

[project.optional-dependencies]
# Pinned: the sibling project's memory measurements were made against 2.9.1.
torch = ["torch==2.9.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
required-version = ">=0.12.10"

# PyPI's win_amd64 torch wheel is CPU-only; the Linux PyPI wheel already
# carries CUDA, so only Windows resolves torch from the pytorch index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu' --strict-markers"
markers = [
    "gpu: needs the Quantiloom renderer and an RTX GPU",
    "real_dataset: needs QUANTILOOM_TEST_DATASET pointing at a rendered dataset",
    "windows_only: runs only on native Windows Python",
]
