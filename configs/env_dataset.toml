# Low-light arm: the same four scenes with the solar spectrum scaled by
# 2e-6 (roughly a full-moon-equivalent 0.2 lux against ~1e5 lux direct
# sun). The sun sits at 5 deg elevation: below the horizon the NN baker
# zeroes solar-scatter terms entirely, while at zenith 85 deg it evaluates
# a grazing-sun atmosphere whose path radiance is twilight-level -- so the
# scaled solar LUT is the moon and the atmosphere stays self-consistent.
# A day-elevation sun would instead bake a daylight path-radiance dome that
# no LUT scaling can reach. VIS takes a 1 s exposure -- at the 50 us
# daylight setting a physically scaled moon is photon-starved, not
# SNR-limited. Scene lamps do not scale with the sun and clip at this
# exposure, as a real night camera would see them. MWIR and LWIR are
# unchanged thermal emission (solved at 23:00). solar_scale is applied to
# the derived solar CSV by the generator, never to the renderer.
[[scenes]]
id = "concrete_moonlight"
config = "env_concrete.toml"
solar_scale = 2e-6
vis_exposure_s = 1.0
[scenes.overrides]
[scenes.overrides.lighting]
sun_direction = [-0.728571, 0.087156, 0.679403]
sun_radiance = [0.0, 0.0, 0.0]
sky_radiance = [0.0, 0.0, 0.0]
solar_lut = "assets/luts/astmg173.csv"
solar_lut_columns = [4, 3]
solar_lut_diffuse_is_global = true
atmosphere_temperature_k = 284.68
[scenes.overrides.thermal]
enabled = true
time_h = 23.0
start_time_h = 0.0
timestep_s = 120.0
layers = 8
initial = "uniform"
initial_temperature_k = 298.8
sun_irradiance_w_m2 = 0.0
diffuse_irradiance_w_m2 = 0.0
exchange_rays = 128
exchange_top_k = 16
checkpoint_stride_h = 4
forcing_file = "../forcing/concrete_day.csv"
[scenes.overrides.atmosphere]
preset = "clear"
model_pack = "H:/Quantiloom-dev/assets/atmos_models"
atmos_model = 2
ihaze = 1
icld = 0
vis_km = 23
rainrt_mm_h = 0
t_ground_K = 300.0
air_temperature_k = 300.0
rh = 0.48
