# Fixed camera profiles throughout this dataset; use a new --out after changes.
[dataset]
name = "env_static_three_band_v1"
qt_root = "H:/Quantiloom-Qt"
cli = "H:/Quantiloom-dev/build/src/app/Release/Quantiloom.exe"
seed = 20261006
spp = 32
wavelength_samples = 12
# authored: scene temperatures; solved: original forcing/thermal solver.
thermal_mode = "solved"
atmosphere_mode = "source"
# One NN pack for the whole dataset: atmospheric state is a recipe-level
# variable, not something each scene may resolve differently.
atmosphere_model_pack = "H:/Quantiloom-dev/assets/atmos_models"
# Labelled modelling assumption extending the source solar CSV beyond 4 um.
solar_ir_policy = "planck_tail"
# constant: strip spectral bindings in IR, authored emissivity only.
# spectral: merged library bindings render measured spectra in every band.
ir_materials = "spectral"
# per_acquisition: one detector seed per band (PRNU/DSNU fixed-pattern maps
# hold still across views, like a real camera) while dataset.acquisition_index
# draws a distinct temporal-noise realisation per capture.
# per_sample: every capture draws all noise classes fresh, FPN included.
# fixed_detector: legacy shared stream, FPN and temporal noise both repeat.
noise_seed_policy = "per_acquisition"
# Emit per-pixel depth/world/normal/validity/instance/material/temperature
# truth per camera.
geometry_truth = true
verification = "pixels"
closure_audit_every = 50

# Full Cartesian product; every tuple always produces all three bands.
[sampling]
# 8 x 2 x 3 per scene entry: neighbouring 15 deg azimuths were near-duplicate
# views for evaluation, and 5 deg elevation (85 deg view zenith on the ground)
# is where the isotropic emissivity of diffuse materials is least reliable.
azimuths_deg = [0, 45, 90, 135, 180, 225, 270, 315]
elevations_deg = [12, 25]
radius_scales = [0.8, 1.0, 1.25]
repeats = 1

[[scenes]]
id = "concrete"
config = "env_concrete.toml"
[[scenes]]
id = "desert"
config = "env_desert.toml"
[[scenes]]
id = "grassland"
config = "env_grassland.toml"
[[scenes]]
id = "seaside"
config = "env_seaside.toml"

# VIS-failure arm: the same four scenes at 23:00 under the same rig. Overrides
# replace whole named sections, so each night variant restates [lighting]
# (sun and solar_lut removed, sky zeroed), [thermal] (same forcing file,
# solved to hour 23) and [atmosphere] (same NN preset, ground temperature and
# humidity taken from the forcing row at 23:00, not kept at day values).
# atmosphere_temperature_k follows the forcing sky_temperature_k; the sun
# direction is the real below-horizon solar position at 23:00.
[[scenes]]
id = "concrete_night"
config = "env_concrete.toml"
[scenes.overrides]
[scenes.overrides.lighting]
sun_direction = [-0.307151, -0.928486, 0.208740]
sun_radiance = [0.0, 0.0, 0.0]
sky_radiance = [0.0, 0.0, 0.0]
atmosphere_temperature_k = 284.68
[scenes.overrides.thermal]
enabled = true
time_h = 23.0
start_time_h = 0.0
timestep_s = 120.0
layers = 8
initial = "uniform"
initial_temperature_k = 298.8
sun_irradiance_w_m2 = 0.0
diffuse_irradiance_w_m2 = 0.0
exchange_rays = 128
exchange_top_k = 16
checkpoint_stride_h = 4
forcing_file = "../forcing/concrete_day.csv"
[scenes.overrides.atmosphere]
preset = "clear"
model_pack = "H:/Quantiloom-dev/assets/atmos_models"
atmos_model = 2
ihaze = 1
icld = 0
vis_km = 23
rainrt_mm_h = 0
t_ground_K = 300.0
air_temperature_k = 300.0
rh = 0.48
relative_humidity = 48
p_hPa = 1013.25
h2o_scale = 1
sky_model = "isotropic"

